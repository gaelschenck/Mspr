[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    unit: Tests unitaires (modèles, schémas)
    integration: Tests d'intégration (endpoints API)
    slow: Tests lents
    requires_server: Tests nécessitant un serveur actif
