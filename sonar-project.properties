# Configuration SonarCloud pour le projet MSPR - VERSION SIMPLE
sonar.projectKey=gaelschenck_Mspr
sonar.organization=gaelschenck
sonar.projectName=MSPR Platform
sonar.projectVersion=1.0

# Configuration simple : analyse tout le répertoire
sonar.sources=.
sonar.tests=backend/tests,frontend/tests

# Exclusions globales (sources ET tests)
sonar.exclusions=**/node_modules/**,**/migrations/**,**/__pycache__/**,**/env_api/**,**/venv/**,**/dist/**,**/build/**,**/logs_pods/**,**/sauvegardes_bdd/**,**/k8s_manifests/**,**/PowerBi/**,**/essaidocker/**,**/coverage/**,**/.git/**,**/.github/**,**/docker-compose.*,**/Dockerfile*,**/*.bat,**/*.md,**/*.txt,**/*.log,**/*.pkl

# Pas de configuration séparée pour les tests (pour éviter les conflits)
# SonarCloud détectera automatiquement les tests par leurs noms
#Inclusions spécifiques pour les tests
sonar.test.inclusions=**/tests/**,**/test_*.py,**/test_*.js,**/test_*.vue,**/*.test.*,**/*.spec.*

# Configuration de couverture
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8
