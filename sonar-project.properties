# Configuration SonarQube pour le projet MSPR
sonar.projectKey=Mspr
sonar.projectName=MSPR Platform
sonar.projectVersion=1.0

# Configuration de la branche principale
sonar.branch.name=addauth

# Sources à analyser
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/migrations/**,**/__pycache__/**,**/env_api/**,**/venv/**,**/dist/**,**/build/**

# Configuration Python
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/test-results.xml

# Configuration JavaScript/Vue.js
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Qualité gate
sonar.qualitygate.wait=true
