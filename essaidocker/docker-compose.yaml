services:
  reverse_proxy:
    build:
      context: .
    container_name: reverse_proxy
    depends_on:
      - backend_fr
      - backend_us
      - backend_ch_de
      - backend_ch_fr
      - backend_ch_en
      - frontend
    networks:
      - essaidocker_my_network
    ports:
      - "80:80"
  db:
    image: postgres:latest
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_HOST: "database"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_DB: "bdd_mspr"
      POSTGRES_PORT: "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - essaidocker_my_network
  db_us:
    image: postgres:latest
    container_name: db_us
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_DB: "bdd_us"
      POSTGRES_PORT: "5432"
    volumes:
      - pg_us_data:/var/lib/postgresql/data
      - ./init_us:/docker-entrypoint-initdb.d
    networks:
      - essaidocker_my_network
  db_ch:
    image: postgres:latest
    container_name: db_ch
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_DB: "bdd_ch"
      POSTGRES_PORT: "5432"
    volumes:
      - pg_ch_data:/var/lib/postgresql/data
      - ./init_ch:/docker-entrypoint-initdb.d
    networks:
      - essaidocker_my_network

  # Backends for different countries
  backend_fr:
    image: my_backend_image
    container_name: backend_fr
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_HOST: "database"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "bdd_mspr"
      USER_COUNTRY: "FR"
      LANG: "fr"
    networks:
      - essaidocker_my_network
    ports:
      - "8084:8084"
    depends_on:
      - db
    build: ../backend
    command: ["/wait-for", "database:5432", "--timeout=60", "--", "uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8084"]
    

  backend_us:
    image: my_backend_image
    container_name: backend_us
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_HOST: "db_us"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "bdd_us"
      USER_COUNTRY: "US"
      LANG: "en"
    networks:
      - essaidocker_my_network
    ports:
      - "8085:8084"
    depends_on:
      - db_us
    build: ../backend
    command: ["/wait-for", "db_us:5432", "--timeout=60", "--", "uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8084"]


  backend_ch_fr:
    image: my_backend_image
    container_name: backend_ch_fr
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_HOST: "db_ch"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "bdd_ch"
      USER_COUNTRY: "CH"
      LANG: "fr"
    networks:
      - essaidocker_my_network
    ports:
      - "8086:8084"
    depends_on:
      - db_ch
    build: ../backend
    command: ["/wait-for", "db_ch:5432", "--timeout=60", "--", "uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8084"]

  backend_ch_en:
    image: my_backend_image
    container_name: backend_ch_en
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_HOST: "db_ch"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "bdd_ch"
      USER_COUNTRY: "CH"
      LANG: "en"
    networks:
      - essaidocker_my_network
    ports:
      - "8087:8084"
    depends_on:
      - db_ch
    build: ../backend
    command: ["/wait-for", "db_ch:5432", "--timeout=60", "--", "uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8084"]

  backend_ch_de:
    image: my_backend_image
    container_name: backend_ch_de
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_HOST: "db_ch"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "bdd_ch"
      USER_COUNTRY: "CH"
      LANG: "de"
    networks:
      - essaidocker_my_network
    ports:
      - "8088:8084"
    depends_on:
      - db_ch
    build: ../backend
    command: ["/wait-for", "db_ch:5432", "--timeout=60", "--", "uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8084"]

  backend_ch_it:
    image: my_backend_image
    container_name: backend_ch_it
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_HOST: "db_ch"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "bdd_ch"
      USER_COUNTRY: "CH"
      LANG: "it"
    networks:
      - essaidocker_my_network
    ports:
      - "8089:8084"  # Corrigé: était en conflit avec 8088
    depends_on:
      - db_ch
    build: ../backend
    command: ["/wait-for", "db_ch:5432", "--timeout=60", "--", "uvicorn", "main:app", "--reload", "--host", "0.0.0.0", "--port", "8084"]
    
  frontend:
    image: my_frontend_image
    container_name: frontend
    depends_on:
      - backend_fr
      - backend_us
      - backend_ch_de
      - backend_ch_fr
      - backend_ch_en
      - backend_ch_it
    networks:
      - essaidocker_my_network
    ports:
      - "3000:3000"

  # SonarQube pour l'analyse de qualité du code
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db_sonar:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ports:
      - "9000:9000"
    depends_on:
      - db_sonar
    networks:
      - essaidocker_my_network

  # Base de données dédiée pour SonarQube
  db_sonar:
    image: postgres:13
    container_name: db_sonar
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_sonar:/var/lib/postgresql/data
    networks:
      - essaidocker_my_network

volumes:
  pg_data:
  pg_us_data:
  pg_ch_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  postgresql_sonar:

networks:
  essaidocker_my_network:
    driver: bridge