apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ch-it
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-ch-it
  template:
    metadata:
      labels:
        app: backend-ch-it
    spec:
      containers:
        - name: backend-ch-it
          image: my_backend_image:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "admin"
            - name: POSTGRES_HOST
              value: "db-ch"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "bdd_ch"
            - name: USER_COUNTRY
              value: "CH"
            - name: LANG
              value: "it"