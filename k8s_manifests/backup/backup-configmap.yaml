apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
  labels:
    app: backup-cronjob
data:
  backup.sh: |
    #!/bin/bash
    set -e
    
    echo "=== Debut de la sauvegarde automatique $(date) ==="
    
    # Créer le dossier de sauvegarde avec timestamp
    BACKUP_DATE=$(date +%Y-%m-%d_%H-%M-%S)
    BACKUP_DIR="/backups/${BACKUP_DATE}"
    mkdir -p "${BACKUP_DIR}"
    
    echo "Dossier de sauvegarde: ${BACKUP_DIR}"
    
    # Fonction de sauvegarde générique
    backup_database() {
        local db_host=$1
        local db_port=$2
        local db_name=$3
        local backup_file="${BACKUP_DIR}/${db_name}_${BACKUP_DATE}.sql"
        
        echo "Sauvegarde de ${db_name} depuis ${db_host}:${db_port}..."
        
        # Attendre que la base soit accessible
        until pg_isready -h "${db_host}" -p "${db_port}" -U "${POSTGRES_USER}"; do
            echo "Attente de la disponibilité de ${db_host}:${db_port}..."
            sleep 5
        done
        
        # Effectuer la sauvegarde
        PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
            -h "${db_host}" \
            -p "${db_port}" \
            -U "${POSTGRES_USER}" \
            -d "${db_name}" \
            --no-password \
            --verbose \
            --clean \
            --if-exists \
            --create \
            > "${backup_file}"
        
        if [ $? -eq 0 ]; then
            echo "✓ Sauvegarde réussie: ${backup_file}"
            # Compresser la sauvegarde
            gzip "${backup_file}"
            echo "✓ Compression réussie: ${backup_file}.gz"
        else
            echo "✗ Échec de la sauvegarde de ${db_name}"
            return 1
        fi
    }
    
    # Sauvegarder toutes les bases
    backup_database "${DB_FR_HOST}" "${DB_FR_PORT}" "${DB_FR_NAME}"
    backup_database "${DB_US_HOST}" "${DB_US_PORT}" "${DB_US_NAME}"
    backup_database "${DB_CH_HOST}" "${DB_CH_PORT}" "${DB_CH_NAME}"
    
    # Créer un fichier de métadonnées
    cat > "${BACKUP_DIR}/backup_info.txt" << EOF
    Date de sauvegarde: ${BACKUP_DATE}
    Bases sauvegardées:
    - ${DB_FR_NAME} depuis ${DB_FR_HOST}:${DB_FR_PORT}
    - ${DB_US_NAME} depuis ${DB_US_HOST}:${DB_US_PORT}
    - ${DB_CH_NAME} depuis ${DB_CH_HOST}:${DB_CH_PORT}
    Taille totale: $(du -sh ${BACKUP_DIR} | cut -f1)
    EOF
    
    echo "=== Sauvegarde terminée avec succès ==="
    
    # Nettoyage: garder seulement les 7 dernières sauvegardes
    echo "Nettoyage des anciennes sauvegardes..."
    cd /backups
    ls -dt */ | tail -n +8 | xargs rm -rf
    echo "Nettoyage terminé."
    
    # Afficher l'espace disque utilisé
    echo "Espace disque utilisé pour les sauvegardes:"
    du -sh /backups/*
    
    echo "=== Fin de la sauvegarde $(date) ==="
