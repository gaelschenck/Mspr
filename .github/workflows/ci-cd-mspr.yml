name: CI/CD MSPR Pandemic Platform

on:
  push:
    branches: [ main, kubernetes, addauth ]
  pull_request:
    branches: [ main, kubernetes, addauth ]

env:
  BACKEND_IMAGE_NAME: mspr/msprapi
  API_IA_IMAGE_NAME: mspr/api_ia
  FRONTEND_IMAGE_NAME: mspr/frontend

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  backend-tests:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies & run tests (msprapi)
        run: |
          cd backend/msprapi
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          pytest --cov=app
      - name: Install dependencies & run tests (api_ia)
        run: |
          cd backend/api_ia
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          pytest --cov=.

  frontend-tests:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run unit tests
        run: |
          cd frontend
          npm run test:unit

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectKey: mspr-pandemic-platform
          organization: ${{ secrets.SONAR_ORG }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: [sonarcloud]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push msprapi
        run: |
          cd backend/msprapi
          docker build -t $BACKEND_IMAGE_NAME:latest .
          docker push $BACKEND_IMAGE_NAME:latest
      - name: Build & push api_ia
        run: |
          cd backend/api_ia
          docker build -t $API_IA_IMAGE_NAME:latest .
          docker push $API_IA_IMAGE_NAME:latest
      - name: Build & push frontend
        run: |
          cd frontend
          npm ci
          npm run build
          docker build -t $FRONTEND_IMAGE_NAME:latest .
          docker push $FRONTEND_IMAGE_NAME:latest

  deploy-fr:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to France
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FR_SERVER_HOST }}
          username: ${{ secrets.FR_SERVER_USER }}
          key: ${{ secrets.FR_SERVER_SSH_KEY }}
          script: |
            cd /path/to/mspr-platform && git pull
            cd /path/to/mspr-platform/infra/env-fr && docker-compose pull && docker-compose up -d

  deploy-us:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to US
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.US_SERVER_HOST }}
          username: ${{ secrets.US_SERVER_USER }}
          key: ${{ secrets.US_SERVER_SSH_KEY }}
          script: |
            cd /path/to/mspr-platform && git pull
            cd /path/to/mspr-platform/infra/env-us && docker-compose pull && docker-compose up -d

  deploy-ch:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Switzerland
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CH_SERVER_HOST }}
          username: ${{ secrets.CH_SERVER_USER }}
          key: ${{ secrets.CH_SERVER_SSH_KEY }}
          script: |
            cd /path/to/mspr-platform && git pull
            cd /path/to/mspr-platform/infra/env-ch && docker-compose pull && docker-compose up -d

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Cleanup workspace
        run: |
          echo 'Cleaning workspace...'

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-fr, deploy-us, deploy-ch]
    if: failure()
    steps:
      - name: Send failure notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.yourserver.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Failed Pipeline: ${{ github.run_id }}"
          to: team@mspr-platform.com
          body: "Something is wrong with ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
