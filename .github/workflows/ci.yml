name: CI/CD MSPR

on:
  push:
    branches: [ main, kubernetes, addauth ]
  pull_request:
    branches: [ main, kubernetes, addauth ]

env:
  BACKEND_IMAGE_NAME: gaelschenck/mspr-backend
  FRONTEND_IMAGE_NAME: gaelschenck/mspr-frontend

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  backend-tests:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nécessaire pour SonarCloud
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies & run tests
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          pytest --cov=. --cov-report=xml --cov-report=html
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-tests:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nécessaire pour SonarCloud
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run unit tests
        run: |
          cd frontend
          npm run test -- --run --coverage
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  sonarqube:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nécessaire pour l'analyse SonarQube
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.projectKey=Mspr
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: [sonarqube]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push backend
        run: |
          cd backend
          # Tag avec le hash du commit pour traçabilité
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t $BACKEND_IMAGE_NAME:latest -t $BACKEND_IMAGE_NAME:$COMMIT_SHA .
          docker push $BACKEND_IMAGE_NAME:latest
          docker push $BACKEND_IMAGE_NAME:$COMMIT_SHA
      - name: Build & push frontend
        run: |
          cd frontend
          npm ci
          npm run build
          # Tag avec le hash du commit pour traçabilité
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t $FRONTEND_IMAGE_NAME:latest -t $FRONTEND_IMAGE_NAME:$COMMIT_SHA .
          docker push $FRONTEND_IMAGE_NAME:latest
          docker push $FRONTEND_IMAGE_NAME:$COMMIT_SHA
      - name: Build and push PostgreSQL images
        run: |
          cd essaidocker
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          docker build -f Dockerfile.postgres-fr -t gaelschenck/mspr-postgres-fr:latest -t gaelschenck/mspr-postgres-fr:$COMMIT_SHA .
          docker build -f Dockerfile.postgres-us -t gaelschenck/mspr-postgres-us:latest -t gaelschenck/mspr-postgres-us:$COMMIT_SHA .
          docker build -f Dockerfile.postgres-ch -t gaelschenck/mspr-postgres-ch:latest -t gaelschenck/mspr-postgres-ch:$COMMIT_SHA .
          
          docker push gaelschenck/mspr-postgres-fr:latest
          docker push gaelschenck/mspr-postgres-fr:$COMMIT_SHA
          docker push gaelschenck/mspr-postgres-us:latest
          docker push gaelschenck/mspr-postgres-us:$COMMIT_SHA
          docker push gaelschenck/mspr-postgres-ch:latest
          docker push gaelschenck/mspr-postgres-ch:$COMMIT_SHA

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/addauth' || github.ref == 'refs/heads/main'
    steps:
      - name: Trigger local deployment (webhook)
        run: |
          echo "Images pushed to Docker Hub successfully!"
          echo "Backend: $BACKEND_IMAGE_NAME:latest"
          echo "Frontend: $FRONTEND_IMAGE_NAME:latest"
          echo ""
          echo "To deploy locally, run your init_and_deploy.bat script"
          echo "or pull the images manually:"
          echo "docker pull $BACKEND_IMAGE_NAME:latest"
          echo "docker pull $FRONTEND_IMAGE_NAME:latest"

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Cleanup workspace
        run: |
          echo 'Cleaning workspace...'

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: failure()
    steps:
      - name: Send failure notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.yourserver.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Failed Pipeline: ${{ github.run_id }}"
          to: team@mspr-platform.com
          body: "Something is wrong with ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"