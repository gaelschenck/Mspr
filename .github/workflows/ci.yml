name: CI/CD MSPR

on:
  push:
    branches: [ main, kubernetes, addauth ]
  pull_request:
    branches: [ main, kubernetes, addauth ]

env:
  BACKEND_IMAGE_NAME: gaelschenck/mspr-backend
  FRONTEND_IMAGE_NAME: gaelschenck/mspr-frontend

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  backend-tests:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies & run tests
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          pytest --cov=.

  frontend-tests:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run unit tests
        run: |
          cd frontend
          npm run test -- --run

  build-and-push:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push backend
        run: |
          cd backend
          # Tag avec le hash du commit pour traçabilité
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t $BACKEND_IMAGE_NAME:latest -t $BACKEND_IMAGE_NAME:$COMMIT_SHA .
          docker push $BACKEND_IMAGE_NAME:latest
          docker push $BACKEND_IMAGE_NAME:$COMMIT_SHA
      - name: Build & push frontend
        run: |
          cd frontend
          npm ci
          npm run build
          # Tag avec le hash du commit pour traçabilité
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t $FRONTEND_IMAGE_NAME:latest -t $FRONTEND_IMAGE_NAME:$COMMIT_SHA .
          docker push $FRONTEND_IMAGE_NAME:latest
          docker push $FRONTEND_IMAGE_NAME:$COMMIT_SHA

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/addauth'
    steps:
      - name: Trigger local deployment (webhook)
        run: |
          echo "Images pushed to Docker Hub successfully!"
          echo "Backend: $BACKEND_IMAGE_NAME:latest"
          echo "Frontend: $FRONTEND_IMAGE_NAME:latest"
          echo ""
          echo "To deploy locally, run your init_and_deploy.bat script"
          echo "or pull the images manually:"
          echo "docker pull $BACKEND_IMAGE_NAME:latest"
          echo "docker pull $FRONTEND_IMAGE_NAME:latest"

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Cleanup workspace
        run: |
          echo 'Cleaning workspace...'

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: failure()
    steps:
      - name: Send failure notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.yourserver.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Failed Pipeline: ${{ github.run_id }}"
          to: team@mspr-platform.com
          body: "Something is wrong with ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"